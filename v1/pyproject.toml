[project]
name = "taskvex"
version = "0.1.0"
description = "TaskVex desktop assistant core"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.26,<5", "pywebview>=6.2.1,<7", "bottle>=0.13.4,<0.14", "google-genai>=2.32,<3", "httpx>=0.28.1,<1"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# google-genai 2.32.0, Python 3.14'te typing'in özel türünü kullanıyor.
# Yalnız bu dış SDK uyarısı hariç tutulur; diğer uyarılar hata olmaya devam eder.
filterwarnings = [
    "error",
    "ignore:'_UnionGenericAlias' is deprecated.*:DeprecationWarning:google.genai.types",
]
